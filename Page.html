<html lang="en" dir="rtl">
<head>

   <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📖 Book PDF WebReader</title>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
   <link rel="stylesheet" href="Styles.css">

</head>
<body>

      <div class="uploader">
         <label for="FileInput" class="Filelabel"> 📂 انتخاب فایل PDF </label>
         <input type="file" id="FileInput" accept=".pdf">
         <span class="FileInfo" id="FileName">هیچ فایلی انتخاب نشده</span>
         <span class="Status" id="Status">⏳ آماده</span>
      </div>

      <div class="Controls">
         <span class="PageIndicator" id="PageIndicator">صفحه ۰ از ۰</span>
         <button id="PrevPage" disabled>▶ قبلی</button>
         <button id="NextPage" disabled>بعدی ◀</button>
         <button id="GoToFirst" disabled>⏭ ابتدا</button>
         <button id="GoToLast" disabled>⏮ انتها</button>
         <button id="Printer">Print 📄</button>
      </div>

      <div class="canvas">
         <canvas id="pdfCanvas"></canvas>
         <div id="placeholder" class="placeholder"> 📄 فایل PDF را انتخاب کنید<br>
            <span style="font-size:0.9rem; color:#94a3b8;">(کتاب‌های حجیم تا ۳۰۰+ صفحه بهینه شده)</span>
         </div>
      </div>

   <script src="./Script.js"></script>
   
</body>
</html>
